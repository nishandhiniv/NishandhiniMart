<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NishandhiniMart Chatbot</title>

    <link
        rel="stylesheet"
        href="css/chatbot.css"
    >
</head>

<body>

    <div class="chatbot-container">

        <!-- Header -->
        <header class="chatbot-header">

            <div class="bot-avatar">
                🤖
            </div>

            <div class="bot-info">
                <h1>NishandhiniMart Assistant</h1>

                <p>
                    <span class="online-dot"></span>
                    Online
                </p>
            </div>

        </header>


        <!-- Chat Area -->
        <main
            class="chat-messages"
            id="chatMessages"
        >

            <!-- Welcome Message -->
            <div class="message bot-message">

                <div class="message-avatar">
                    🤖
                </div>

                <div class="message-content">
                    <p>
                        Hello! Welcome to NishandhiniMart.
                    </p>

                    <p>
                        How can I help you today?
                    </p>
                </div>

            </div>

        </main>


        <!-- Quick Questions -->
        <div class="quick-questions">

            <button
                type="button"
                class="quick-btn"
                data-message="What products are available?"
            >
                🛍️ Products
            </button>

            <button
                type="button"
                class="quick-btn"
                data-message="How can I add products to my cart?"
            >
                🛒 Cart
            </button>

            <button
                type="button"
                class="quick-btn"
                data-message="How can I place an order?"
            >
                📦 Orders
            </button>

            <button
                type="button"
                class="quick-btn"
                data-message="How can I give a review?"
            >
                ⭐ Reviews
            </button>

        </div>


        <!-- Input Area -->
        <form
            class="chat-input-area"
            id="chatForm"
        >

            <input
                type="text"
                id="messageInput"
                placeholder="Type your message..."
                maxlength="2000"
                autocomplete="off"
            >

            <button
                type="submit"
                id="sendButton"
            >
                Send
            </button>

        </form>

    </div>


    <script src="js/chatbot.js"></script>

</body>
</html>
