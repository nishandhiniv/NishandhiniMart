<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>NishandhiniMart - Buyer Dashboard</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f6fa;
            color: #222;
        }

        /* HEADER */

        header {
            background: #ffffff;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #2874f0;
        }

        .logo span {
            color: #ff9800;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .welcome {
            font-size: 15px;
            color: #555;
        }

        .cart-btn {
            background: #2874f0;
            color: white;
            border: none;
            padding: 11px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        .cart-btn:hover {
            background: #1257c7;
        }

        .logout-btn {
            background: #e53935;
            color: white;
            border: none;
            padding: 11px 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        .logout-btn:hover {
            background: #c62828;
        }

        /* HERO */

        .hero {
            background: linear-gradient(135deg, #2874f0, #174ea6);
            color: white;
            padding: 45px 40px;
            text-align: center;
        }

        .hero h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 17px;
            opacity: 0.95;
        }

        /* SEARCH */

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            padding: 25px 20px;
            flex-wrap: wrap;
        }

        .search-box {
            width: 420px;
            max-width: 90%;
            padding: 13px 16px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        .search-box:focus {
            border-color: #2874f0;
        }

        .category-select {
            padding: 13px 16px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
            background: white;
            cursor: pointer;
        }

        /* PRODUCTS */

        .products-section {
            padding: 10px 40px 50px;
        }

        .section-title {
            text-align: center;
            font-size: 25px;
            margin: 20px 0 25px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
            max-width: 1250px;
            margin: auto;
        }

        .product-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(0,0,0,0.10);
            transition: 0.25s;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 7px 20px rgba(0,0,0,0.15);
        }

        .product-image {
            width: 100%;
            height: 210px;
            object-fit: contain;
            background: #fff;
            padding: 12px;
        }

        .product-info {
            padding: 17px;
        }

        .category {
            font-size: 12px;
            color: #777;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .product-name {
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .description {
            font-size: 13px;
            color: #666;
            min-height: 35px;
            margin-bottom: 10px;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            color: #1a8f3c;
            margin-bottom: 12px;
        }

        .add-btn {
            width: 100%;
            background: #ff9800;
            color: white;
            border: none;
            padding: 11px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .add-btn:hover {
            background: #e68900;
        }

        /* LOADING */

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 18px;
            color: #2874f0;
        }

        /* EMPTY */

        .no-products {
            text-align: center;
            padding: 40px;
            color: #777;
            display: none;
        }

        /* CART PANEL */

        .cart-panel {
            position: fixed;
            right: -400px;
            top: 0;
            width: 380px;
            max-width: 90%;
            height: 100vh;
            background: white;
            box-shadow: -5px 0 15px rgba(0,0,0,0.2);
            z-index: 200;
            transition: 0.3s;
            padding: 25px;
            overflow-y: auto;
        }

        .cart-panel.active {
            right: 0;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .close-cart {
            background: #e53935;
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 17px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #eee;
            padding: 12px 0;
        }

        .cart-item img {
            width: 65px;
            height: 65px;
            object-fit: contain;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-name {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .cart-item-price {
            color: #1a8f3c;
        }

        .remove-btn {
            background: #e53935;
            color: white;
            border: none;
            padding: 6px 9px;
            border-radius: 4px;
            cursor: pointer;
        }

        .cart-total {
            font-size: 21px;
            font-weight: bold;
            margin-top: 20px;
            text-align: right;
        }

        .checkout-btn {
            width: 100%;
            background: #2874f0;
            color: white;
            border: none;
            padding: 13px;
            margin-top: 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .checkout-btn:hover {
            background: #1257c7;
        }

        /* OVERLAY */

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            z-index: 150;
            display: none;
        }

        .overlay.active {
            display: block;
        }

        /* FOOTER */

        footer {
            background: #172337;
            color: white;
            text-align: center;
            padding: 22px;
            margin-top: 30px;
        }

        /* RESPONSIVE */

        @media (max-width: 1000px) {

            .products-grid {
                grid-template-columns: repeat(3, 1fr);
            }

        }

        @media (max-width: 750px) {

            header {
                padding: 0 15px;
            }

            .welcome {
                display: none;
            }

            .products-section {
                padding: 10px 20px 40px;
            }

            .products-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .hero h1 {
                font-size: 26px;
            }

        }

        @media (max-width: 500px) {

            .products-grid {
                grid-template-columns: 1fr;
            }

            .logo {
                font-size: 20px;
            }

            .cart-panel {
                width: 100%;
            }

        }

    </style>

</head>


<body>


<!-- HEADER -->

<header>

    <div class="logo">
        Nishandhini<span>Mart</span>
    </div>

    <div class="header-right">

        <div class="welcome">
            Welcome to NishandhiniMart
        </div>

        <button class="cart-btn" onclick="openCart()">
            🛒 Cart (<span id="cartCount">0</span>)
        </button>

        <button class="logout-btn" onclick="logout()">
            Logout
        </button>

    </div>

</header>


<!-- HERO -->

<section class="hero">

    <h1>Welcome to NishandhiniMart 🛒</h1>

    <p>
        Your Online Shopping Mart
    </p>

</section>


<!-- SEARCH AND FILTER -->

<div class="controls">

    <input
        type="text"
        id="searchInput"
        class="search-box"
        placeholder="Search products..."
        onkeyup="filterProducts()"
    >

    <select
        id="categoryFilter"
        class="category-select"
        onchange="filterProducts()"
    >

        <option value="all">
            All Categories
        </option>

        <option value="Electronics">
            Electronics
        </option>

        <option value="Computers">
            Computers
        </option>

        <option value="Fashion">
            Fashion
        </option>

        <option value="Home & Kitchen">
            Home & Kitchen
        </option>

        <option value="Grocery">
            Grocery
        </option>

        <option value="Snacks">
            Snacks
        </option>

    </select>

</div>


<!-- PRODUCTS -->

<section class="products-section">

    <h2 class="section-title">
        Our Products
    </h2>

    <div
        id="loading"
        class="loading">

        Loading products...

    </div>

    <div
        id="productsGrid"
        class="products-grid">
    </div>

    <div
        id="noProducts"
        class="no-products">

        No products found.

    </div>

</section>


<!-- CART OVERLAY -->

<div
    id="overlay"
    class="overlay"
    onclick="closeCart()">
</div>


<!-- CART -->

<div
    id="cartPanel"
    class="cart-panel">

    <div class="cart-header">

        <h2>
            Shopping Cart
        </h2>

        <button
            class="close-cart"
            onclick="closeCart()">

            ×

        </button>

    </div>

    <div id="cartItems"></div>

    <div class="cart-total">

        Total:
        ₹<span id="cartTotal">0</span>

    </div>

    <button
        class="checkout-btn"
        onclick="checkout()">

        Confirm Order

    </button>

</div>


<!-- FOOTER -->

<footer>

    <p>
        © 2026 NishandhiniMart | Online Shopping Website
    </p>

</footer>


<script>


/* =========================================
   BACKEND API
========================================= */

const API_URL =
    "http://127.0.0.1:8080/api/products";


/* =========================================
   PRODUCTS
========================================= */

let products = [];

let cart = [];


/* =========================================
   LOAD PRODUCTS FROM BACKEND
========================================= */

async function loadProducts() {

    const loading =
        document.getElementById("loading");

    try {

        loading.style.display = "block";

        const response =
            await fetch(API_URL);

        if (!response.ok) {

            throw new Error(
                "HTTP error: " +
                response.status
            );

        }

        const data =
            await response.json();

        console.log(
            "Products API response:",
            data
        );


        /*
            Backend may return:

            [
                {
                    id,
                    product_name,
                    description,
                    price,
                    image
                }
            ]

            OR

            {
                products: [...]
            }
        */


        if (Array.isArray(data)) {

            products = data;

        }
        else if (Array.isArray(data.products)) {

            products = data.products;

        }
        else {

            products = [];

        }


        /*
            Convert backend field names
            into frontend field names.
        */

        products = products.map(
            product => {

                return {

                    id:
                        Number(product.id),

                    name:
                        product.product_name ||
                        product.name ||
                        "Product",

                    category:
                        product.category ||
                        "General",

                    price:
                        Number(product.price) || 0,

                    description:
                        product.description ||
                        "Quality product.",

                    image:
                        product.image ||
                        ""

                };

            }
        );


        loading.style.display = "none";


        if (products.length === 0) {

            document.getElementById(
                "noProducts"
            ).style.display = "block";

            return;

        }


        displayProducts(products);


    }
    catch (error) {

        console.error(
            "Products loading error:",
            error
        );

        loading.style.display = "none";

        document.getElementById(
            "productsGrid"
        ).innerHTML = "";

        document.getElementById(
            "noProducts"
        ).style.display = "block";

        document.getElementById(
            "noProducts"
        ).innerHTML =
            `
            <p>
                Unable to load products.
            </p>
            <br>
            <p>
                Please make sure the backend
                server is running.
            </p>
            `;

    }

}


/* =========================================
   IMAGE PATH
========================================= */

function getImagePath(image) {

    if (!image) {

        return "images/laptop.jpg";

    }


    /*
        If backend sends:

        images/rice.jpg

        use:

        images/rice.jpg
    */

    if (
        image.startsWith("http://") ||
        image.startsWith("https://") ||
        image.startsWith("data:")
    ) {

        return image;

    }


    /*
        Remove leading slash.
    */

    image =
        image.replace(/^\/+/, "");


    /*
        If backend sends:

        images/rice.jpg

        keep it.
    */

    if (
        image.startsWith("images/")
    ) {

        return image;

    }


    /*
        If backend sends only:

        rice.jpg

        convert to:

        images/rice.jpg
    */

    return "images/" + image;

}


/* =========================================
   DISPLAY PRODUCTS
========================================= */

function displayProducts(list) {

    const grid =
        document.getElementById(
            "productsGrid"
        );

    const noProducts =
        document.getElementById(
            "noProducts"
        );


    grid.innerHTML = "";


    if (list.length === 0) {

        noProducts.style.display =
            "block";

        return;

    }


    noProducts.style.display =
        "none";


    list.forEach(product => {

        const card =
            document.createElement(
                "div"
            );


        card.className =
            "product-card";


        const imagePath =
            getImagePath(
                product.image
            );


        card.innerHTML = `

            <img
                src="${imagePath}"
                alt="${product.name}"
                class="product-image"
                onerror="this.onerror=null; this.src='images/laptop.jpg';"
            >

            <div class="product-info">

                <div class="category">
                    ${product.category}
                </div>

                <div class="product-name">
                    ${product.name}
                </div>

                <div class="description">
                    ${product.description}
                </div>

                <div class="price">
                    ₹${product.price.toLocaleString("en-IN")}
                </div>

                <button
                    class="add-btn"
                    onclick="addToCart(${product.id})">

                    Add to Cart

                </button>

            </div>

        `;


        grid.appendChild(card);

    });

}


/* =========================================
   SEARCH + CATEGORY FILTER
========================================= */

function filterProducts() {

    const search =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .toLowerCase();


    const category =
        document
            .getElementById(
                "categoryFilter"
            )
            .value;


    const filtered =
        products.filter(
            product => {

                const productName =
                    String(
                        product.name || ""
                    ).toLowerCase();


                const productCategory =
                    String(
                        product.category || ""
                    );


                const matchesSearch =
                    productName.includes(
                        search
                    );


                const matchesCategory =
                    category === "all" ||
                    productCategory === category;


                return (
                    matchesSearch &&
                    matchesCategory
                );

            }
        );


    displayProducts(filtered);

}


/* =========================================
   ADD TO CART
========================================= */

function addToCart(productId) {

    const product =
        products.find(
            p =>
                p.id === productId
        );


    if (!product) {

        return;

    }


    const existing =
        cart.find(
            item =>
                item.id === productId
        );


    if (existing) {

        existing.quantity++;

    }
    else {

        cart.push({

            ...product,

            quantity: 1

        });

    }


    updateCart();


    alert(
        product.name +
        " added to cart!"
    );

}


/* =========================================
   UPDATE CART
========================================= */

function updateCart() {

    const cartCount =
        document.getElementById(
            "cartCount"
        );


    const cartItems =
        document.getElementById(
            "cartItems"
        );


    const cartTotal =
        document.getElementById(
            "cartTotal"
        );


    let totalQuantity = 0;

    let totalPrice = 0;


    cartItems.innerHTML = "";


    cart.forEach(item => {

        totalQuantity +=
            item.quantity;


        totalPrice +=
            item.price *
            item.quantity;


        const div =
            document.createElement(
                "div"
            );


        div.className =
            "cart-item";


        const imagePath =
            getImagePath(
                item.image
            );


        div.innerHTML = `

            <img
                src="${imagePath}"
                alt="${item.name}"
                onerror="this.onerror=null; this.src='images/laptop.jpg';"
            >

            <div class="cart-item-info">

                <div class="cart-item-name">
                    ${item.name}
                </div>

                <div>
                    Quantity:
                    ${item.quantity}
                </div>

                <div class="cart-item-price">
                    ₹${(
                        item.price *
                        item.quantity
                    ).toLocaleString("en-IN")}
                </div>

            </div>

            <button
                class="remove-btn"
                onclick="removeFromCart(${item.id})">

                Remove

            </button>

        `;


        cartItems.appendChild(div);

    });


    if (cart.length === 0) {

        cartItems.innerHTML =
            "<p>Your cart is empty.</p>";

    }


    cartCount.textContent =
        totalQuantity;


    cartTotal.textContent =
        totalPrice.toLocaleString(
            "en-IN"
        );

}


/* =========================================
   REMOVE CART ITEM
========================================= */

function removeFromCart(productId) {

    cart =
        cart.filter(
            item =>
                item.id !== productId
        );


    updateCart();

}


/* =========================================
   OPEN CART
========================================= */

function openCart() {

    document
        .getElementById(
            "cartPanel"
        )
        .classList
        .add("active");


    document
        .getElementById(
            "overlay"
        )
        .classList
        .add("active");

}


/* =========================================
   CLOSE CART
========================================= */

function closeCart() {

    document
        .getElementById(
            "cartPanel"
        )
        .classList
        .remove("active");


    document
        .getElementById(
            "overlay"
        )
        .classList
        .remove("active");

}

/* =========================================
   CHECKOUT
========================================= */

async function checkout() {

    if (cart.length === 0) {
        alert("Your cart is empty.");
        return;
    }

    // Logged-in user ID
    const userId = localStorage.getItem("userId");

    if (!userId) {
        alert("Please login first.");
        window.location.href = "login.html";
        return;
    }

    // Calculate total
    let totalAmount = 0;

    cart.forEach(item => {
        totalAmount += item.price * item.quantity;
    });

    try {

        // -------------------------------
        // STEP 1: CREATE ORDER
        // -------------------------------

        const orderResponse = await fetch(
            "http://127.0.0.1:8080/api/orders",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    user_id: Number(userId),
                    total_amount: totalAmount
                })
            }
        );

        const orderResult =
            await orderResponse.json();

        console.log(
            "Order Response:",
            orderResult
        );

        if (!orderResponse.ok ||
            !orderResult.success) {

            alert(
                "Order creation failed!"
            );

            return;
        }

        const orderId =
            orderResult.order_id;


        // -------------------------------
        // STEP 2: CREATE ORDER ITEMS
        // -------------------------------

        for (const item of cart) {

            const itemResponse = await fetch(
                "http://127.0.0.1:8080/api/order-items",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        order_id: orderId,
                        product_id: item.id,
                        quantity: item.quantity,
                        price: item.price
                    })
                }
            );

            const itemResult =
                await itemResponse.json();

            console.log(
                "Order Item Response:",
                itemResult
            );

            if (!itemResponse.ok ||
                !itemResult.success) {

                alert(
                    "Order item creation failed!"
                );

                return;
            }
        }


        // -------------------------------
        // STEP 3: SUCCESS MESSAGE
        // -------------------------------

        alert(
            "Order placed successfully!\nOrder ID: " +
            orderId
        );


        // -------------------------------
        // STEP 4: CLEAR CART
        // -------------------------------

        cart = [];

        updateCart();

        closeCart();

    }
    catch (error) {

        console.error(
            "Checkout Error:",
            error
        );

        alert(
            "Unable to place order. Please try again."
        );
    }
}


/* =========================================
   LOGOUT
========================================= */

function logout() {

    localStorage.clear();

    window.location.href =
        "login.html";

}


/* =========================================
   INITIAL LOAD
========================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadProducts();

        updateCart();

    }
);


</script>


</body>

</html>
