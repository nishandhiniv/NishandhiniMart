<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NishandhiniMart - Create Account</title>

    <link rel="stylesheet" href="auth-style.css">
</head>

<body>

    <div class="registration-container">

        <h1>NishandhiniMart</h1>

        <h2>Create Your Account</h2>

        <p class="subtitle">
            Join NishandhiniMart as a Buyer or Seller
        </p>

        <!-- ROLE SELECTION -->

        <div class="role-selection">

            <button
                type="button"
                id="buyerRoleBtn"
                class="role-btn active"
                onclick="selectRole('buyer')">
                Buyer
            </button>

            <button
                type="button"
                id="sellerRoleBtn"
                class="role-btn"
                onclick="selectRole('seller')">
                Seller
            </button>

        </div>


        <form id="registrationForm">

            <!-- USERNAME -->

            <label for="username">Username</label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your username"
                required
            >


            <!-- EMAIL -->

            <label for="email">Email ID</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email ID"
                required
            >


            <!-- PASSWORD -->

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a password"
                required
            >


            <!-- CONFIRM PASSWORD -->

            <label for="confirmPassword">Confirm Password</label>

            <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Re-enter your password"
                required
            >


            <!-- SELLER ONLY FIELDS -->

            <div id="sellerFields" style="display: none;">

                <label for="store_name">
                    Unique Store Name / Brand Name
                </label>

                <input
                    type="text"
                    id="store_name"
                    name="store_name"
                    placeholder="Enter your unique store name"
                >


                <label for="phone">Phone Number</label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter your phone number"
                >


                <label for="address">Store Address</label>

                <textarea
                    id="address"
                    name="address"
                    placeholder="Enter your store address"
                    rows="3"
                ></textarea>

            </div>


            <!-- HIDDEN ROLE -->

            <input
                type="hidden"
                id="role"
                name="role"
                value="buyer"
            >


            <button type="submit" id="registerButton">
                Create Buyer Account
            </button>

        </form>


        <p id="message"></p>


        <p class="login-link">
            Already have an account?
            <a href="login.html">Login here</a>
        </p>

    </div>


    <script>

        let selectedRole = "buyer";


        function selectRole(role) {

            selectedRole = role;

            document.getElementById("role").value = role;

            const buyerButton =
                document.getElementById("buyerRoleBtn");

            const sellerButton =
                document.getElementById("sellerRoleBtn");

            const sellerFields =
                document.getElementById("sellerFields");

            const registerButton =
                document.getElementById("registerButton");


            if (role === "buyer") {

                buyerButton.classList.add("active");
                sellerButton.classList.remove("active");

                sellerFields.style.display = "none";

                document.getElementById("store_name").required = false;
                document.getElementById("phone").required = false;
                document.getElementById("address").required = false;

                registerButton.textContent =
                    "Create Buyer Account";

            } else {

                sellerButton.classList.add("active");
                buyerButton.classList.remove("active");

                sellerFields.style.display = "block";

                document.getElementById("store_name").required = true;
                document.getElementById("phone").required = true;
                document.getElementById("address").required = true;

                registerButton.textContent =
                    "Create Seller Account";
            }
        }

    </script>


    <script src="script.js"></script>

</body>

</html>
